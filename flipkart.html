<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <link rel="stylesheet" href="flipkart.css">
  <link rel="stylesheet" href="header.css">
  <title id="title"></title>

<body id="body" class="bg-red-400">
  <header>
    <div id="navbar" class=" flex items-center pl-7 pr-7 pt-3 pb-3 h-16 ">
      <div id="flipkartlogo" class="ml-40" > 
        <img src="images/flipkartlogo.svg">
      </div>
      <div id="searchbox" class="flex ml-10">
        <search>
          <div id="searchicon" class="flex items-center"> <svg width="24" height="24" class="" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><title>Search Icon</title><path d="M10.5 18C14.6421 18 18 14.6421 18 10.5C18 6.35786 14.6421 3 10.5 3C6.35786 3 3 6.35786 3 10.5C3 14.6421 6.35786 18 10.5 18Z" stroke="#717478" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M16 16L21 21" stroke="#717478" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>

          <div id="searchtext" class="flex items-center pl-2"> <input type="text" placeholder="Search for Products, Brands and More" class="w-100" id="text"></div>
         
        </search>
       </div>
     
        <div id="iconsinheader" class="flex items-center">
          <div id="login" class="flex items-center"><img src="images/login.svg" class="flex"> Login</div>
          
          <div id="cart" class="flex items-center"><img src="images/cart.svg" class="pl-10"> Cart</div>
          <div id="becomeaseller" class="flex items-center"><img src="images/becomeaseller.svg" class="pl-10"> Become a Seller</div>
          <div id="threedots"><img src="images/3dotsattheend.svg" class="pl-10"></div>
        </div>
      </div>
    
  </header>

  
  <script src="flipkart.js"></script>
</body>
</html>
