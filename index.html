<head>

<body>
    <nav>
      <div id="nav">
        <div id="nav1">

            <span style="color: #ffc200;">Plus</span>
          </span>
        </div>

            <div class="navtab" id="searchbar">
              
              <svg
                width="24"
                height="24"
                class=""
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">
                  
                <title>Search Icon</title>
                  
                <path
                d="M10.5 18C14.6421 18 18 14.6421 18 10.5C18 6.35786 14.6421 3 10.5 3C6.35786 3 3 6.35786 3 10.5C3 14.6421 6.35786 18 10.5 18Z"
                stroke="#717478"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round">   
                </path>
                 
                <path
                d="M16 16L21 21"
                stroke="#717478"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round">   
                </path>
                    
              </svg>
                   
              <span>
                <input
                  id="input_data"
                  type="text"
                  placeholder="Search for Products, Brands and More" />
              </span>

            </div>

            <div class="navtab">
              <span>
                <img
                  src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/Store-9eeae2.svg"
                  alt="become a seller" />
              </span>
              <span style="font-size: 15px; font-family: sans-serif; padding-left: 12px">Become a Seller</span>
            </div>
              
            <div class="navtab">
              <span>
                <img
                  src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/profile-815786.svg"
                  alt="Sign in" />
              </span>
            
              <span style="font-size: 15px; font-family: sans-serif; padding-left: 12px">
                <div class="login-container">
                  <button class="login-button">
                    <span>Login</span>
                    <i class="arrow"></i>
                  </button>
                  <div class="dropdown-content">
                    <div class="new-customer">
                      <p>New customer?</p>
                      <a href="#">Sign Up</a>
                      </div>
                       <a href="#" class="menu-item">My Profile</a>
                       <a href="#" class="menu-item">Flipkart Plus Zone</a>
                       <a href="#" class="menu-item">Orders</a>
                       <a href="#" class="menu-item">Wishlist</a>
                       <a href="#" class="menu-item">Rewards</a>
                       <a href="#" class="menu-item">Gift Cards</a>
                  </div>
              </div>
            </div>
            
            <div class="navtab">
              <span>
                <img
                  src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/header_cart-eed150.svg"
                  alt="become a seller" />
              </span>
              <span style="font-size: 15px; font-family: sans-serif; padding-left: 12px">Cart</span>
            </div>

            <div class="navtab">
              <span>
                <img class="-dOa_b" src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/header_3verticalDots-ea7819.svg" width="24" height="24" alt="Dropdown with more help links">          
              </span>
            </div>
    </div>

  <section id="categories"></section>

  <section id="carousal">
    <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
          <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
          <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" src="https://rukminim1.flixcart.com/fk-p-flap/1600/270/image/3351c6e7bf60c6bc.png?q=20" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="https://rukminim2.flixcart.com/fk-p-flap/1620/270/image/f8a6f4b6634430ed.jpeg?q=20" alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="https://rukminim2.flixcart.com/fk-p-flap/1620/270/image/5dbe24535d092e63.jpg?q=20" alt="Third slide">
          </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div> 
    </section>
